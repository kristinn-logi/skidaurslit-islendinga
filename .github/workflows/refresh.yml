name: Refresh data and deploy

on:
  schedule:
    # Season (Oct–Apr): every day at 22:00 UTC
    - cron: "0 22 * 1-4,10-12 *"
    # Off-season (May–Sep): Mondays at 22:00 UTC
    - cron: "0 22 * 5-9 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the data check
        run: python -m unittest tests/test_check_data.py

      - name: Restore scrape cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: fis-cache-${{ github.run_id }}
          restore-keys: fis-cache-

      - name: Keep a copy of the previous data
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          for f in athletes points_lists results; do
            git show "HEAD:data/$f.csv" > "$RUNNER_TEMP/prev/$f.csv"
          done

      - name: Scrape FIS
        run: python fis_scraper.py

      - name: Build app data
        run: python build_data.py

      - name: Check the new data
        run: |
          python scripts/check_data.py --new data --prev "$RUNNER_TEMP/prev"
          node tests/test_metrics.js

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv app/data.js
          git diff --cached --quiet || {
            git commit -m "data: refresh $(date -u +%F)" &&
            git pull --rebase origin main &&
            git push origin HEAD:main
          }

      - name: Save scrape cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: fis-cache-${{ github.run_id }}

  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
